name: Book image

on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', '!LICENSE', '!.gitignore', 'code/**/examples/**']
  pull_request:
    paths: ['**', '!**/*.md', '!docs/**', '!LICENSE', '!.gitignore', 'code/**/examples/**']
  workflow_dispatch:
    inputs:
      validation:
        description: 'auto: reuse matching full results; full: rerun everything; quick: no publication'
        type: choice
        options: [auto, full, quick]
        default: auto
  workflow_call:
    inputs:
      validation:
        type: string
        default: auto
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  repository_dispatch:
    types: [owl-updated]

permissions:
  contents: read

# Serialize all publications; PR checks use a separate group and cannot publish.
# Keep the existing group/cache IDs during migration to share the lock and warm
# dependency cache with older runs. These internal IDs do not create image tags.
concurrency:
  group: book-pilot-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BOOK_VALIDATION_MODE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.validation || 'auto' }}
    steps:
      - uses: actions/checkout@v7

      - name: Test build and promotion rules
        run: python3 -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v4

      - name: Resolve exact compiler, source commits and Ubuntu base
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 docker/build.py --resolve-only --output "${RUNNER_TEMP}/book-build.json" --github-output

      - name: Compare with the last published environment and full results
        id: plan
        run: python3 docker/ci_plan.py --resolved "${RUNNER_TEMP}/book-build.json" --mode "$BOOK_VALIDATION_MODE" --output "${RUNNER_TEMP}/book-plan.json"

      - name: Release the pulled baseline after extracting its evidence
        if: steps.plan.outputs.build == 'true'
        run: |
          for tag in latest main; do
            docker image rm "matrixanger/springer-book-code:$tag" 2>/dev/null || true
          done

      - name: Build and load the tested image
        if: steps.plan.outputs.build == 'true'
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: matrixanger/springer-book-code:ci
          build-contexts: verification_cache=./.book-cache
          build-args: |
            ${{ steps.resolve.outputs.build_args }}
            BOOK_VALIDATION_MODE=${{ env.BOOK_VALIDATION_MODE }}
            BOOK_VERIFY_NONCE=${{ env.BOOK_VALIDATION_MODE == 'full' && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
          cache-from: type=gha,scope=book-pilot
          cache-to: type=gha,scope=book-pilot,mode=max

      - name: Validate the exact built image
        if: steps.plan.outputs.build == 'true'
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: |
          extra=()
          if [ "$BOOK_VALIDATION_MODE" = quick ]; then extra+=(--allow-quick); fi
          python3 docker/validate.py --image "$IMAGE_ID" --resolved "${RUNNER_TEMP}/book-build.json" --output "${RUNNER_TEMP}/book-validation.json" "${extra[@]}"

      - name: Check publishing credentials
        if: steps.plan.outputs.build == 'true' && env.BOOK_VALIDATION_MODE != 'quick' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('HUB_TOKEN'):
              raise SystemExit('Add the repository Actions secret DOCKERHUB_TOKEN (Read, Write & Delete for matrixanger). Build validation has passed; publication is not configured.')
          PY

      - name: Log in to Docker Hub
        if: steps.plan.outputs.build == 'true' && env.BOOK_VALIDATION_MODE != 'quick' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: matrixanger
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push unique image, verify registry pull, promote latest
        if: steps.plan.outputs.build == 'true' && env.BOOK_VALIDATION_MODE != 'quick' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: python3 docker/publish.py --image "$IMAGE_ID" --resolved "${RUNNER_TEMP}/book-build.json" --validation "${RUNNER_TEMP}/book-validation.json" --output "${RUNNER_TEMP}/book-published.json" --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # The book records source commits, not image versions: keep only latest's build tag.
      - name: Delete superseded build tags
        if: steps.plan.outputs.build == 'true' && env.BOOK_VALIDATION_MODE != 'quick' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 docker/prune_tags.py

      - name: Save version and validation records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: book-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-*.json
          if-no-files-found: ignore
          retention-days: 10
